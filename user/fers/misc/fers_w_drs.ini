# fers init file: fers.ini
[LogCollector.log]
EULOG_GUI_LOG_FILE_PATTERN = /mnt/mybook/MAXICC/CERNTB_Sept2025/data/raw/EULog_$12D.log

[Producer.my_fers0]
FERS_IP_ADDRESS = 172.16.0.11:tdl:0:0  # IP:tdl:0:0 
FERS_DEV_LOCK_PATH = /tmp/myfers0.lock
FERS_ID = "Front"
FERS_RO_MODE = 0
FERS_PRODID="my_fers0"

[Producer.my_fers1]
FERS_IP_ADDRESS = 172.16.0.11:tdl:1:0  # IP:tdl:0:0 
FERS_DEV_LOCK_PATH = /tmp/myfers1.lock
FERS_ID = "Rear right"
FERS_RO_MODE = 0
FERS_PRODID="my_fers1"

[Producer.my_fers2]
FERS_IP_ADDRESS = 172.16.0.11:tdl:2:0  # IP:tdl:0:0 
FERS_DEV_LOCK_PATH = /tmp/myfers2.lock
FERS_ID = "Rear left"
FERS_RO_MODE = 0
FERS_PRODID="my_fers2"


[Producer.my_drs0]
DRS_BASE_ADDRESS = DDDD # hex adresses of the DRS board
DRS_DEV_LOCK_PATH = /tmp/mydrs0.lock
DRS_ID = "VME Crate"
DRS_PRODID="my_drs0"


